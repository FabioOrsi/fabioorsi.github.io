  <style>
    body {
      margin: 0;
      background-color: #1a1a1a;
    }

    model-viewer {
      width: 90%;
      height: 400px;
      background-color: #252525;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      padding: 30px;
      padding-top: 5px;
      padding-bottom: 5px;
      background: #121212;
    }

    .model-card {
      background: #1e1e1e;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #333;
      color: white;
      font-family: sans-serif;

      display: flex;
      flex-direction: column; /* Keeps the info section below the model */
      align-items: center;    /* Centers children horizontally */

    }

    .model-card:hover {
      border-color: #00d1ff;
      transform: scale(1.01);
      transition: all 0.2s ease;
    }



    .info { padding: 15px; padding-bottom: 0px;}
    .info h3 { margin: 0 0 10px; color: #00d1ff; justify-self: center; }
    .info p { font-size: 0.9rem; color: #999; line-height: 1.4; justify-self: center; }

  </style>
